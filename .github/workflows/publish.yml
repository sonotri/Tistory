name: Publish MD to Tistory (Headless)

on:
  push:
    branches: [sonotri] # 너의 브랜치명
  workflow_dispatch:
    inputs:
      md_path:
        description: "posts/*.md 경로(선택)"
        required: false
        default: ""
jobs:
  publish:
    runs-on: ubuntu-latest

    # 공통 환경변수 (여기 블로그 주소만 네 것으로 수정!)
    env:
      TISTORY_BLOG_URL: "https://sonowhstudy.tistory.com" # ← 마지막 슬래시 없이!
      # 세션은 GitHub Secrets에 TISTORY_STORAGE_B64 로 저장해두어야 합니다.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (npm + Playwright)
        run: |
          npm ci || npm i
          npx playwright install --with-deps

      # 변경된 md 목록 추출 (이번 커밋에서 posts/*.md 만)
      - name: Detect changed MD
        id: changed
        shell: bash
        run: |
          set -e
          git diff --name-only HEAD^ HEAD 2>/dev/null | grep '^posts/.*\.md$' || true > changed.txt
          echo "----- Changed MD files -----"
          cat changed.txt || true
          COUNT=$(wc -l < changed.txt | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Fail if no MD
        if: ${{ steps.changed.outputs.count == '0' }}
        run: |
          echo "No posts/*.md in last commit."
          exit 1

      - name: Publish each MD to Tistory
        env:
          TISTORY_STORAGE_B64: ${{ secrets.TISTORY_STORAGE_B64 }}
        shell: bash
        run: |
          set -e
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "Posting $f"
            MD_PATH="$f" node ./scripts/post.mjs
          done < changed.txt

      # 디버깅 자료(스크린샷/HTML/비디오) 업로드 — 실패 원인 파악용
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug
          path: |
            screenshots/
            page.html
            video.webm
          if-no-files-found: ignore
