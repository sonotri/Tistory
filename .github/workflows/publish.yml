name: Publish MD to Tistory (Headless)

on:
  push:
    branches: [sonotri] # ← 네 브랜치명
  workflow_dispatch:
    inputs:
      md_path:
        description: "posts/*.md 경로(선택)"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      TISTORY_BLOG_URL: "https://sonowhstudy.tistory.com" # ← 본인 주소(끝에 / 금지)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (npm + Playwright)
        run: |
          npm ci || npm i
          npx playwright install --with-deps

      # 대상 MD 선택: (1) 입력값 > (2) 변경분 > (3) 최신 MD
      - name: Detect target MD
        id: detect
        shell: bash
        run: |
          set -e
          INPUT="${{ github.event.inputs.md_path }}"
          if [ -n "$INPUT" ]; then
            echo "files=$INPUT" >> $GITHUB_OUTPUT
            echo "[detect] use input: $INPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          git diff --name-only "$BEFORE" "$AFTER" | grep '^posts/.*\.md$' || true > changed.txt

          if [ -s changed.txt ]; then
            FIRST=$(head -n1 changed.txt)
            echo "files=$FIRST" >> $GITHUB_OUTPUT
            echo "[detect] changed md: $FIRST"
            exit 0
          fi

          # 변경이 없으면 레포에서 가장 최근 수정된 md를 선택
          LATEST=$(git ls-files 'posts/*.md' | while read f; do
            echo "$(git log -1 --format=%ct -- "$f") $f"
          done | sort -nr | head -n1 | cut -d' ' -f2- || true)

          if [ -n "$LATEST" ]; then
            echo "files=$LATEST" >> $GITHUB_OUTPUT
            echo "[detect] fallback latest md: $LATEST"
          else
            echo "files=" >> $GITHUB_OUTPUT
            echo "[detect] no posts/*.md found in repo"
          fi

      - name: Fail if no MD
        if: ${{ steps.detect.outputs.files == '' }}
        run: |
          echo "No posts/*.md to publish (none changed and none found)."
          exit 1

      - name: Publish to Tistory
        env:
          TISTORY_STORAGE_B64: ${{ secrets.TISTORY_STORAGE_B64 }}
          MD_PATH: ${{ steps.detect.outputs.files }}
        run: |
          echo "[publish] Posting $MD_PATH"
          node ./scripts/post.mjs

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug
          path: |
            screenshots/
            page.html
            video.webm
          if-no-files-found: ignore
